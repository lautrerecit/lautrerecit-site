<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Se connecter · L’Algérie a pensé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--cr:#F2EDE4;--cr2:#EAE3D8;--paper-w:#FFFCF4;--em-d:#13442E;--em-deep:#0A2C1E;--em:#1F6B4A;--or:#9A7B2E;--or2:#C4A24A;--or3:#D4B05A;--ink:#0E0C0A;--ink2:#3D3730;--red-hi:#7A2236;--title:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}
body{background:radial-gradient(120% 130% at 50% 0%,#FBF8F2,var(--cr) 62%);color:var(--ink);font-family:var(--sans);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:440px;width:100%;background:radial-gradient(135% 120% at 50% 0%,var(--em),#154430 82%);border:1px solid rgba(196,162,74,.34);border-radius:20px;overflow:hidden;box-shadow:0 34px 80px -46px rgba(16,48,32,.6)}
.bd{padding:clamp(36px,6vw,52px) clamp(28px,5vw,44px)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--or3);text-align:center;display:flex;align-items:center;justify-content:center;gap:12px}
.eyebrow::before,.eyebrow::after{content:"";width:22px;height:1px;background:var(--or3);opacity:.6}
h1{font-family:var(--title);font-weight:700;font-size:clamp(26px,4vw,34px);color:#F4EEE3;text-align:center;margin:16px 0 8px}
h1 em{font-style:italic;color:var(--or3)}
p.lede{font-family:var(--sans);font-size:14.5px;color:#D7E5DC;text-align:center;max-width:38ch;margin:0 auto 30px}
form{display:grid;gap:14px}
input{font-family:var(--mono);font-size:15px;letter-spacing:.04em;padding:15px 18px;border-radius:11px;border:1px solid rgba(212,176,90,.4);background:rgba(244,251,246,.06);color:#F4EEE3;outline:none}
input::placeholder{color:rgba(215,229,220,.45)}
input:focus{border-color:var(--or3)}
button{font-family:var(--sans);font-weight:600;font-size:15px;padding:15px 18px;border-radius:11px;border:none;background:linear-gradient(180deg,#F4DC92,var(--or2) 60%,#A9863A);color:var(--em-deep);cursor:pointer;transition:transform .2s}
button:hover{transform:translateY(-1px)}
.err{font-family:var(--sans);font-size:13.5px;color:#F2B8C2;text-align:center;min-height:18px;margin-top:2px}
.foot{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:rgba(215,229,220,.55);text-align:center;margin-top:26px}
.foot a{color:var(--or3);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="bd">
    <div class="eyebrow">L’Algérie a pensé</div>
    <h1>Se <em>connecter</em></h1>
    <p class="lede">Entrez le code reçu par email pour accéder à votre formation.</p>
    <form id="gate-form" autocomplete="off">
      <input id="code" type="password" placeholder="Code d’accès" autocapitalize="off" spellcheck="false" required>
      <button type="submit">Accéder →</button>
      <div class="err" id="err"></div>
    </form>
    <div class="foot">Code perdu ? <a href="mailto:contact@lautrerecit.com">contact@lautrerecit.com</a></div>
  </div>
</div>
<script>
(function(){
  var CODE_HASH = "e3a39b09598107bbc407bb25b0484fe2732ef9d21d54414ab3ffb0c32cbcebb8";
  function sha256(str){
    // Web Crypto — retourne une Promise<hex>
    var enc = new TextEncoder().encode(str.trim().toLowerCase());
    return crypto.subtle.digest('SHA-256', enc).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('00'+b.toString(16)).slice(-2); }).join('');
    });
  }
  var params = new URLSearchParams(location.search);
  var redirect = params.get('redirect') || '/algerie/';
  document.getElementById('gate-form').addEventListener('submit', function(e){
    e.preventDefault();
    var val = document.getElementById('code').value;
    sha256(val).then(function(hash){
      if (hash === CODE_HASH) {
        try { localStorage.setItem('algerie_unlocked', '1'); } catch(e){}
        location.href = redirect;
      } else {
        document.getElementById('err').textContent = 'Code incorrect.';
      }
    });
  });
})();
</script>
</body>
</html>
