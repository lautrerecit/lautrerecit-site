.lrq .bascule{margin:26px auto 0;max-width:56ch;padding:20px 24px;background:rgba(244,251,246,.06);border:1px solid rgba(212,176,90,.3);border-radius:12px;position:relative;z-index:2}
.lrq .bascule-k{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--or3);font-weight:600}
.lrq .bascule p{font-size:14.5px;line-height:1.65;color:rgba(244,251,246,.88);margin:8px 0 0}
.lrq .bascule b{color:var(--or3);font-weight:600}

<div class="lrq">
<main class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <h1>Le <em>rappel</em>.</h1>
  <p class="lede">Cinq à six choix. Aucun ne teste votre mémoire : chacun oppose des <b>lectures défendables</b>, et une seule tient. Le vrai enseignement est dans la correction de celle que vous aurez choisie.</p>

  <div class="mods" id="mods"></div>

  <div class="stage" id="stage"></div>

  <div class="foot">
    <div class="foot-brand"><span></span>L'Autre Récit</div>
    <div class="foot-l">Le rappel · avant le carnet</div>
  </div>
</main>
</div>
<script>
/* ── Paramètres du cours (remplis par build-rappel.js) ── */
var COURS_LABEL = "Penser la résistance";
var COURS_NUM = "Cours III";
var eb = document.getElementById("eyebrow");
if (eb) eb.textContent = "L'Algérie a pensé · " + COURS_NUM + " · " + COURS_LABEL;

var DATA = {
  "m11": {
    "key": "M11",
    "title": "Les nationalismes algériens, plusieurs projets rivaux",
    "bascule": "Quatre voix discutaient la nation ; <b>une seule a fini par parler en son nom, et par les armes.</b> Le carnet vous demande qui prétend parler seul au nom d'un groupe, et où un bloc supposé uniforme cache une pluralité réelle.",
    "qs": [
      {
        "k": "1 · L'enjeu",
        "fact": "En 1954, il ne reste qu'un seul parti, le Front de libération nationale. Mais pendant plus de trente ans, quatre projets rivaux se sont affrontés, sans s'accorder ni sur le territoire, ni sur la place de l'islam.",
        "ask": "Que faut-il en conclure ?",
        "opts": [
          {
            "t": "Que l'unité fut lente à venir : quatre courants ont fini par converger.",
            "ok": false,
            "fb": "La convergence supposerait une discussion aboutie. Le module dit l'inverse : <b>cette unité est un aboutissement, et un aboutissement violent.</b> On n'a pas convergé, on a rallié."
          },
          {
            "t": "Que la nation dormait déjà : il ne restait plus qu'à la réveiller.",
            "ok": false,
            "fb": "C'est l'image que le module écarte d'entrée : <b>une nation n'est pas une évidence qui attend d'être réveillée.</b> Rien ne dormait, tout se disputait."
          },
          {
            "t": "Qu'elle est un enjeu de pouvoir : qui parle légitimement au nom de tous.",
            "ok": true,
            "fb": "Avant même qu'existe un État algérien, des organisations se disputent le droit de dire ce qu'est la nation. <b>Ce qui se joue, c'est le monopole de la représentation.</b>"
          }
        ]
      },
      {
        "k": "2 · Messali",
        "fact": "En juin 1926 se crée à Paris l'Étoile nord-africaine, dans l'orbite du Parti communiste français. En février 1927, au Congrès de Bruxelles, Messali Hadj réclame l'indépendance totale de l'Algérie, la première fois qu'un Algérien pose publiquement cette exigence.",
        "ask": "Que faut-il retenir de cette origine ?",
        "opts": [
          {
            "t": "Le premier mot d'indépendance vient de l'exil ouvrier, pas d'Alger.",
            "ok": true,
            "fb": "Ni les salons, ni les médersas : l'émigration ouvrière en France, au contact du mouvement communiste, dans un congrès internationaliste. <b>Les Algériens y sont dits « réduits à l'état de bagnards ».</b>"
          },
          {
            "t": "Le nationalisme algérien est né communiste avant de devenir religieux.",
            "ok": false,
            "fb": "L'orbite communiste est réelle et le nationalisme ne s'y convertit pas. Messali garde l'islam <b>comme ciment identitaire, au service d'un projet d'abord politique.</b>"
          },
          {
            "t": "L'indépendance fut d'abord un mot d'ordre venu de la paysannerie.",
            "ok": false,
            "fb": "C'est la thèse de Lacheraf, et elle porte sur ce qui a fait la nation, non sur qui a formulé l'exigence. <b>La revendication naît dans l'émigration ; la paysannerie en sera le réservoir.</b>"
          }
        ]
      },
      {
        "k": "3 · Abbas mal lu",
        "fact": "1936, dans L'Entente : « J'ai interrogé l'histoire, j'ai interrogé les vivants et les morts ». Dès 1943 il rédige le Manifeste du peuple algérien ; en avril 1956, il rejoint le Front de libération nationale.",
        "ask": "Que constate exactement Abbas en 1936 ?",
        "opts": [
          {
            "t": "Que le peuple algérien n'existe pas : la nation reste à inventer.",
            "ok": false,
            "fb": "C'est la lecture qu'on lui prête, et elle lui fait dire la thèse coloniale. Il constate <b>l'absence d'une nation déjà constituée comme fait politique, non l'inexistence du peuple algérien.</b>"
          },
          {
            "t": "L'absence d'une nation déjà constituée comme fait politique, rien de plus.",
            "ok": true,
            "fb": "Une position d'assimilationniste, datée, et qui ne dure pas. <b>C'est le refus colonial d'accorder l'égalité qui pousse l'assimilationniste vers l'indépendance.</b>"
          },
          {
            "t": "Qu'il faut choisir la France : l'égalité vaut mieux que la rupture.",
            "ok": false,
            "fb": "Il y a cru sincèrement, et sa trajectoire réfute l'idée d'un choix arrêté : <b>Manifeste en 1943, ralliement au Front de libération nationale en 1956.</b> On ne cite d'ordinaire que la moitié du texte."
          }
        ]
      },
      {
        "k": "4 · La grille de l'islam",
        "fact": "Oulémas : « L'islam est notre religion, l'arabe est notre langue, l'Algérie est notre patrie. » Messali : un ciment identitaire au service d'un projet politique. Abbas, formé à la laïcité : la sphère privée. Communistes : au second plan.",
        "ask": "Que révèle cette grille ?",
        "opts": [
          {
            "t": "Un horizon partagé dont la place reste disputée : il unit et sépare.",
            "ok": true,
            "fb": "Tous le rencontrent, aucun ne lui donne le même rang. <b>C'est exactement pour cela qu'il est un enjeu de pouvoir, et pas seulement une croyance.</b>"
          },
          {
            "t": "Une fracture nette : deux camps religieux contre deux camps laïques.",
            "ok": false,
            "fb": "Le partage en deux blocs efface les degrés. Entre le fondement des Oulémas et le ciment mobilisateur de Messali, <b>il y a un écart de fonction, pas une frontière de camp.</b>"
          },
          {
            "t": "Une hiérarchie stable : la foi passe avant la classe et la loi.",
            "ok": false,
            "fb": "Aucune hiérarchie ne s'impose, c'est là tout le problème. <b>Un même mot peut unir et diviser dans le même mouvement</b>, selon la place qu'on lui assigne dans le projet."
          }
        ]
      },
      {
        "k": "5 · Le Parti communiste algérien",
        "fact": "Congrès constitutif à Alger en 1936, délégués « indigènes » et européens mêlés. En 1939, Maurice Thorez forge la thèse de la « nation algérienne en formation », faite de « vingt races » qui se fondent dans le creuset.",
        "ask": "Quelle place tient ce courant ?",
        "opts": [
          {
            "t": "Il pousse à l'indépendance : le prolétaire colonisé n'a rien à perdre.",
            "ok": false,
            "fb": "Le parti reste longtemps ambigu sur l'indépendance. La thèse de Thorez décrit <b>une nation pas encore là, qui se construit dans l'union avec la France.</b>"
          },
          {
            "t": "Il double les Oulémas : la classe remplace la foi, le projet demeure.",
            "ok": false,
            "fb": "Substituer un fondement à un autre laisserait la même architecture. Or il change la question : <b>la nation se définit par la lutte des classes, en laissant de côté l'ethnie et la foi.</b>"
          },
          {
            "t": "Il pense la nation par la classe, quand les autres disent foi.",
            "ok": true,
            "fb": "Le prolétaire algérien et le prolétaire français ont le même adversaire, le capital. <b>Il occupe une place que personne d'autre ne tient</b>, ambiguïté comprise."
          }
        ]
      },
      {
        "k": "6 · Melouza",
        "fact": "Été 1954, le Mouvement pour le triomphe des libertés démocratiques éclate ; le Front de libération nationale exige le ralliement des autres. Messali fonde le Mouvement national algérien. Nuit du 28 au 29 mai 1957, à Melouza, au moins trois cents villageois exterminés par l'Armée de libération nationale.",
        "ask": "Que prouve Melouza ?",
        "opts": [
          {
            "t": "Que la guerre civile a précédé l'indépendance de plusieurs années.",
            "ok": false,
            "fb": "La chronologie est juste et ne dit pas l'enjeu. Ce n'est pas une guerre civile pour le pouvoir d'État : <b>c'est une guerre pour le monopole de la représentation de la nation.</b>"
          },
          {
            "t": "Que le monopole de la représentation s'est aussi payé dans le sang.",
            "ok": true,
            "fb": "Trois cents villageois tués par d'autres Algériens, soupçonnés de soutenir le mauvais camp. <b>Le monopole ne s'est pas seulement imposé par la parole.</b>"
          },
          {
            "t": "Que les représailles coloniales visaient d'abord les villages nationalistes.",
            "ok": false,
            "fb": "Le massacre n'est pas français. C'est une unité de l'Armée de libération nationale : <b>une guerre dans la guerre, que l'histoire officielle a longtemps tue.</b>"
          }
        ]
      }
    ]
  }
};

/* ═══════════ MOTEUR ═══════════ */
(function(){
  var stage = document.getElementById('stage');
  var modsEl = document.getElementById('mods');
  var cur = null, qi = 0, score = 0, answered = false;
  var LET = ['A','B','C','D','E'];

  var __firstId = Object.keys(DATA)[0];
  (function(){
    var m = DATA[__firstId];
    var b = document.createElement('div');
    b.className = 'mod-btn';
    b.innerHTML = '<div class="mod-k">Module ' + m.key.slice(1) + ' · ' + m.qs.length + ' questions</div>';
    modsEl.appendChild(b);
  })();

  function start(id){
    cur = DATA[id]; qi = 0; score = 0;
    render();
  }
  start(__firstId);

  function render(){
    answered = false;
    var q = cur.qs[qi];
    var html = '';
    html += '<div class="playcard">';
    html += '<div class="hero"><div class="hk">Le rappel · ' + cur.key + '</div><div class="ht">' + cur.title + '</div><div class="hbar"><i style="width:' + (qi/cur.qs.length*100) + '%"></i></div><div class="hsc">Score <b>' + score + '</b> / ' + cur.qs.length + '</div></div>';
    html += '<div class="qcard">';
    html += '<div class="q-k">Question ' + q.k + '</div>';
    html += '<p class="q-fact">' + q.fact + '</p>';
    html += '<p class="q-ask">' + q.ask + '</p>';
    html += '<div class="opts">';
    for (var i=0;i<q.opts.length;i++){
      html += '<button type="button" class="opt" data-i="' + i + '"><span class="L">' + LET[i] + '</span><span class="tx">' + q.opts[i].t + '</span><span class="mk"></span></button>';
    }
    html += '</div><div id="fb-zone"></div><div class="next-row hidden" id="next-row"><button type="button" class="btn" id="next-btn">' + (qi < cur.qs.length-1 ? 'Question suivante' : 'Voir le résultat') + ' <span class="ar">→</span></button></div>';
    html += '</div></div>';
    stage.innerHTML = html;
    requestAnimationFrame(function(){
      var f = stage.querySelector('.hbar i');
      if (f) f.style.width = (qi/cur.qs.length*100) + '%';
    });
    var opts = stage.querySelectorAll('.opt');
    for (var j=0;j<opts.length;j++){ opts[j].addEventListener('click', pick); }
    document.getElementById('next-btn').addEventListener('click', next);
  }

  function pick(e){
    if (answered) return;
    answered = true;
    var q = cur.qs[qi];
    var idx = parseInt(e.currentTarget.getAttribute('data-i'), 10);
    var chosen = q.opts[idx];
    if (chosen.ok) score++;
    var opts = stage.querySelectorAll('.opt');
    for (var i=0;i<opts.length;i++){
      opts[i].setAttribute('disabled','');
      var o = q.opts[i];
      var mk = opts[i].querySelector('.mk');
      if (i === idx){
        opts[i].classList.add(o.ok ? 'picked-good' : 'picked-bad');
        mk.textContent = o.ok ? '✓' : '✕';
      } else if (o.ok){
        opts[i].classList.add('reveal-good');
        mk.textContent = '✓';
      } else {
        opts[i].classList.add('faded');
      }
    }
    document.getElementById('fb-zone').innerHTML = '<div class="fb"><span class="fb-k">Pourquoi</span>' + chosen.fb + '</div>';
    document.getElementById('next-row').classList.remove('hidden');
    var sc = stage.querySelector('.hsc b'); if (sc) sc.textContent = score;
    var bar = stage.querySelector('.hbar i'); if (bar) bar.style.width = ((qi+1)/cur.qs.length*100) + '%';
  }

  function next(){
    qi++;
    if (qi < cur.qs.length){ render(); }
    else { final(); }
    stage.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function final(){
    var n = cur.qs.length;
    var verdict;
    if (score === n) verdict = "Sans faute. Les contresens que ce module désamorce, vous les repérez désormais chez les autres. C'est exactement l'outil.";
    else if (score >= n-1) verdict = "L'essentiel tient. Relisez la correction de votre erreur : c'est la lecture que vous portiez en arrivant.";
    else if (score >= Math.ceil(n/2)) verdict = "Les corrections que vous venez de lire sont le vrai contenu de ce rappel. Elles valent une réécoute ciblée.";
    else verdict = "Ce module retourne des évidences, il est normal qu'il résiste. Réécoutez-le avec les corrections en tête : elles nomment vos lectures une par une.";
    var html = '';
    html += '<div class="final">';
    html += '<div class="final-k">Le rappel · ' + cur.key + ' · ' + cur.title + '</div>';
    html += '<div class="score">' + score + '<span> / ' + n + '</span></div>';
    html += '<p class="final-verdict">' + verdict + '</p>';
    html += '<div class="bascule"><div class="bascule-k">Maintenant, le carnet</div><p>' + cur.bascule + '</p></div>';
    html += '<div class="final-cta"><a class="btn" href="https://www.lautrerecit.com/algerie/carnet/" target="_blank" rel="noopener">Ouvrir mon carnet <span class="ar">→</span></a><button type="button" class="btn-ghost" id="redo">Refaire ce rappel</button></div>';
    html += '</div>';
    stage.innerHTML = html;
    document.getElementById('redo').addEventListener('click', function(){ qi=0; score=0; render(); });
  }
})();
</script>
