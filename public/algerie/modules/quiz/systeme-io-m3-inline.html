<div class="lrq">
<main class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <h1>Le <em>rappel</em>.</h1>
  <p class="lede">Cinq à six choix. Aucun ne teste votre mémoire : chacun oppose des <b>lectures défendables</b>, et une seule tient. Le vrai enseignement est dans la correction de celle que vous aurez choisie.</p>

  <div class="mods" id="mods"></div>

  <div class="stage" id="stage"></div>

  <div class="foot">
    <div class="foot-brand"><span></span>L'Autre Récit</div>
    <div class="foot-l">Le rappel · avant le carnet</div>
  </div>
</main>
</div>
<script>
/* ── Paramètres du cours (remplis par build-rappel.js) ── */
var COURS_LABEL = "La machine coloniale";
var COURS_NUM = "Cours I";
var eb = document.getElementById("eyebrow");
if (eb) eb.textContent = "L'Algérie a pensé · " + COURS_NUM + " · " + COURS_LABEL;

var DATA = {
  "m3": {
    "key": "M03",
    "title": "Conquête & dépossession",
    "concl": "Le droit a pris la terre. Le module suivant montre ce qu'il fait aux personnes.",
    "bascule": "Vous avez vu un droit qui prend, là où l'on attend un droit qui protège. <b>Le carnet vous en demande un autre</b>, et surtout, en quoi il n'est <b>pas</b> celui-là.",
    "qs": [
      {
        "k": "1 · L'inversion",
        "fact": "Le module ouvre sur le rapport entre le droit colonial et la dépossession.",
        "ask": "Quel est ce rapport ?",
        "opts": [
          {
            "t": "Le droit <em>opère</em> la prise : il en est l'instrument.",
            "ok": true,
            "fb": "La force n'aurait pas suffi. On a fait signer au droit, sénatus-consultes, Warnier, code forestier."
          },
          {
            "t": "Le droit <em>enregistre</em> la prise : il légalise un fait accompli.",
            "ok": false,
            "fb": "Position sérieuse, le droit comme ratification. Mais Warnier ne ratifie rien : il crée la vendabilité. <b>Le texte précède le transfert.</b>"
          },
          {
            "t": "Le droit <em>borne</em> la prise : il en limite les excès.",
            "ok": false,
            "fb": "Lecture républicaine. Elle suppose une intention bonne qui aurait dérapé. <b>L'effet était le but.</b>"
          }
        ]
      },
      {
        "k": "2 · 1863",
        "fact": "Le sénatus-consulte s'intitule : <b>reconnaître aux tribus la propriété de leurs terres</b>.",
        "ask": "Que fait ce titre ?",
        "opts": [
          {
            "t": "Il ment : rien n'est reconnu, la terre est simplement saisie.",
            "ok": false,
            "fb": "Le réflexe anticolonial, et il rate tout. <b>La reconnaissance est réelle : c'est ce qui la rend efficace.</b>"
          },
          {
            "t": "Il dit vrai, et c'est le levier : reconnaître, c'est délimiter.",
            "ok": true,
            "fb": "Délimiter, c'est déjà fractionner. 475 000 hectares finissent au domaine de l'État."
          },
          {
            "t": "Il dit vrai, mais l'effet est involontaire : l'État voulait stabiliser.",
            "ok": false,
            "fb": "La thèse des conséquences non voulues. Mais 1863 délimite, 1873 fractionne, 1885 exproprie. <b>Une chaîne n'est pas un accident.</b>"
          }
        ]
      },
      {
        "k": "3 · 1871",
        "fact": "Après l'insurrection d'El Mokrani : 36 millions de francs-or de contribution, 450 000 hectares confisqués.",
        "ask": "Que fait la révolte, dans le dispositif ?",
        "opts": [
          {
            "t": "Elle fournit le titre : la répression ouvre la dépossession.",
            "ok": true,
            "fb": "La révolte donne au droit ce qu'il ne pouvait pas prendre seul. Les terres partent aux réfugiés d'Alsace-Lorraine."
          },
          {
            "t": "Elle appelle la sanction : on réprime, puis on punit la faute.",
            "ok": false,
            "fb": "Raisonnement pénal. La sanction n'est pas calibrée sur la faute, <b>elle l'est sur ce qu'il y avait à prendre.</b>"
          },
          {
            "t": "La force achève ce que le droit n'avait pu prendre.",
            "ok": false,
            "fb": "Inversion séduisante, et fausse. Les 450 000 hectares sont confisqués <em>par décret</em>, redistribués <em>par décret</em>. <b>Le droit n'a pas échoué : il a encaissé.</b>"
          }
        ]
      },
      {
        "k": "4 · Warnier",
        "fact": "1873. La loi Warnier rend individuelle la terre <em>arch</em>, jusque-là collective. Après elle, le colon n'a plus besoin de confisquer.",
        "ask": "Pourquoi ?",
        "opts": [
          {
            "t": "Parce que l'État confisque à sa place, puis lui revend.",
            "ok": false,
            "fb": "Il y a bien des confiscations, 324 000 hectares dès 1873. Mais c'est la partie visible, pas le mécanisme."
          },
          {
            "t": "Parce que la terre, devenue individuelle, est vendable.",
            "ok": true,
            "fb": "« Le paysan devient un homme qu'on peut exproprier. » Le marché fait le reste."
          },
          {
            "t": "Parce que la tribu fractionnée n'oppose plus de front commun.",
            "ok": false,
            "fb": "Lecture khaldounienne, et elle a du charme. Mais Warnier ne vise pas la cohésion : <b>il vise la forme juridique du sol.</b>"
          }
        ]
      },
      {
        "k": "5 · Le déracinement, le concept",
        "fact": "Bourdieu et Sayad : le paysan dépossédé peut rester paysan <b>sans plus pouvoir se comporter en paysan</b>.",
        "ask": "Que nomme cette phrase ?",
        "opts": [
          {
            "t": "Il a perdu sa terre : la misère explique tout le reste.",
            "ok": false,
            "fb": "La misère existe. Elle n'est pas le concept. <b>Y réduire le déracinement, c'est le désarmer.</b>"
          },
          {
            "t": "Il est devenu prolétaire : sa terre n'est plus qu'un salaire.",
            "ok": false,
            "fb": "Lecture marxiste, sérieuse. Mais Bourdieu et Sayad ne parlent pas de position de classe : <b>ils parlent d'un monde de sens qui s'effondre.</b>"
          },
          {
            "t": "Il garde son savoir ; le monde qui lui donnait sens a disparu.",
            "ok": true,
            "fb": "Il connaît encore les saisons. Le code forestier le dit mieux que tout : <b>ramasser du bois mort est devenu un délit.</b>"
          }
        ]
      }
    ]
  }
};

/* ═══════════ MOTEUR ═══════════ */
(function(){
  var stage = document.getElementById('stage');
  var modsEl = document.getElementById('mods');
  var cur = null, qi = 0, score = 0, answered = false;
  var LET = ['A','B','C','D','E'];

  var __firstId = Object.keys(DATA)[0];
  (function(){
    var m = DATA[__firstId];
    var b = document.createElement('div');
    b.className = 'mod-btn';
    b.innerHTML = '<div class="mod-k">Module ' + m.key.slice(1) + ' · ' + m.qs.length + ' questions</div>';
    modsEl.appendChild(b);
  })();

  function start(id){
    cur = DATA[id]; qi = 0; score = 0;
    render();
  }
  start(__firstId);

  function render(){
    answered = false;
    var q = cur.qs[qi];
    var html = '';
    html += '<div class="playcard">';
    html += '<div class="hero"><div class="hk">Le rappel · ' + cur.key + '</div><div class="ht">' + cur.title + '</div><div class="hbar"><i style="width:' + (qi/cur.qs.length*100) + '%"></i></div><div class="hsc">Score <b>' + score + '</b> / ' + cur.qs.length + '</div></div>';
    html += '<div class="qcard">';
    html += '<div class="q-k">Question ' + q.k + '</div>';
    html += '<p class="q-fact">' + q.fact + '</p>';
    html += '<p class="q-ask">' + q.ask + '</p>';
    html += '<div class="opts">';
    for (var i=0;i<q.opts.length;i++){
      html += '<button type="button" class="opt" data-i="' + i + '"><span class="L">' + LET[i] + '</span><span class="tx">' + q.opts[i].t + '</span><span class="mk"></span></button>';
    }
    html += '</div><div id="fb-zone"></div><div class="next-row hidden" id="next-row"><button type="button" class="btn" id="next-btn">' + (qi < cur.qs.length-1 ? 'Question suivante' : 'Voir le résultat') + ' <span class="ar">→</span></button></div>';
    html += '</div></div>';
    stage.innerHTML = html;
    requestAnimationFrame(function(){
      var f = stage.querySelector('.hbar i');
      if (f) f.style.width = (qi/cur.qs.length*100) + '%';
    });
    var opts = stage.querySelectorAll('.opt');
    for (var j=0;j<opts.length;j++){ opts[j].addEventListener('click', pick); }
    document.getElementById('next-btn').addEventListener('click', next);
  }

  function pick(e){
    if (answered) return;
    answered = true;
    var q = cur.qs[qi];
    var idx = parseInt(e.currentTarget.getAttribute('data-i'), 10);
    var chosen = q.opts[idx];
    if (chosen.ok) score++;
    var opts = stage.querySelectorAll('.opt');
    for (var i=0;i<opts.length;i++){
      opts[i].setAttribute('disabled','');
      var o = q.opts[i];
      var mk = opts[i].querySelector('.mk');
      if (i === idx){
        opts[i].classList.add(o.ok ? 'picked-good' : 'picked-bad');
        mk.textContent = o.ok ? '✓' : '✕';
      } else if (o.ok){
        opts[i].classList.add('reveal-good');
        mk.textContent = '✓';
      } else {
        opts[i].classList.add('faded');
      }
    }
    document.getElementById('fb-zone').innerHTML = '<div class="fb"><span class="fb-k">Pourquoi</span>' + chosen.fb + '</div>';
    document.getElementById('next-row').classList.remove('hidden');
    var sc = stage.querySelector('.hsc b'); if (sc) sc.textContent = score;
    var bar = stage.querySelector('.hbar i'); if (bar) bar.style.width = ((qi+1)/cur.qs.length*100) + '%';
  }

  function next(){
    qi++;
    if (qi < cur.qs.length){ render(); }
    else { final(); }
    stage.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function final(){
    var n = cur.qs.length;
    var verdict;
    if (score === n) verdict = "Sans faute. Les contresens que ce module désamorce, vous les repérez désormais chez les autres. C'est exactement l'outil.";
    else if (score >= n-1) verdict = "L'essentiel tient. Relisez la correction de votre erreur : c'est la lecture que vous portiez en arrivant.";
    else if (score >= Math.ceil(n/2)) verdict = "Les corrections que vous venez de lire sont le vrai contenu de ce rappel. Elles valent une réécoute ciblée.";
    else verdict = "Ce module retourne des évidences, il est normal qu'il résiste. Réécoutez-le avec les corrections en tête : elles nomment vos lectures une par une.";
    var html = '';
    html += '<div class="final">';
    html += '<div class="final-k">Le rappel · ' + cur.key + ' · ' + cur.title + '</div>';
    html += '<div class="score">' + score + '<span> / ' + n + '</span></div>';
    html += '<p class="final-verdict">' + verdict + '</p>';
    html += '<div class="bascule"><div class="bascule-k">Maintenant, le carnet</div><p>' + cur.bascule + '</p></div>';
    html += '<div class="final-cta"><a class="btn" href="https://www.lautrerecit.com/algerie/carnet/" target="_blank" rel="noopener">Ouvrir mon carnet <span class="ar">→</span></a><button type="button" class="btn-ghost" id="redo">Refaire ce rappel</button></div>';
    html += '</div>';
    stage.innerHTML = html;
    document.getElementById('redo').addEventListener('click', function(){ qi=0; score=0; render(); });
  }
})();
</script>
