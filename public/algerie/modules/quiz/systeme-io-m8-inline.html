.lrq .bascule{margin:26px auto 0;max-width:56ch;padding:20px 24px;background:rgba(244,251,246,.06);border:1px solid rgba(212,176,90,.3);border-radius:12px;position:relative;z-index:2}
.lrq .bascule-k{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--or3);font-weight:600}
.lrq .bascule p{font-size:14.5px;line-height:1.65;color:rgba(244,251,246,.88);margin:8px 0 0}
.lrq .bascule b{color:var(--or3);font-weight:600}

<div class="lrq">
<main class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <h1>Le <em>rappel</em>.</h1>
  <p class="lede">Cinq à six choix. Aucun ne teste votre mémoire : chacun oppose des <b>lectures défendables</b>, et une seule tient. Le vrai enseignement est dans la correction de celle que vous aurez choisie.</p>

  <div class="mods" id="mods"></div>

  <div class="stage" id="stage"></div>

  <div class="foot">
    <div class="foot-brand"><span></span>L'Autre Récit</div>
    <div class="foot-l">Le rappel · avant le carnet</div>
  </div>
</main>
</div>
<script>
/* ── Paramètres du cours (remplis par build-rappel.js) ── */
var COURS_LABEL = "Penser la résistance";
var COURS_NUM = "Cours III";
var eb = document.getElementById("eyebrow");
if (eb) eb.textContent = "L'Algérie a pensé · " + COURS_NUM + " · " + COURS_LABEL;

var DATA = {
  "m8": {
    "key": "M08",
    "title": "Abd el-Kader & Ibn Badis, résister, restaurer",
    "bascule": "Deux hommes séparés par presque un siècle, une même opération : <b>reconstruire un peuple que la défaite militaire laisse debout.</b> Le carnet vous demande une défaite, la vôtre ou celle qu'on vous a racontée, et ce qu'elle n'a pas pu prendre.",
    "qs": [
      {
        "k": "1 · L'État avant l'État",
        "fact": "À partir de 1832, Abd el-Kader prend la tête de la résistance dans l'ouest. Le module refuse aussitôt l'image du cavalier héroïque : il lève un impôt régulier, frappe sa propre monnaie, organise une armée distincte des contingents tribaux, fonde des villes-étapes.",
        "ask": "Que fait-il, exactement ?",
        "opts": [
          {
            "t": "Il unifie les tribus : sans coalition, aucune résistance ne tient.",
            "ok": false,
            "fb": "C'est justement ce que la liste dément : son armée régulière est <b>distincte des contingents tribaux.</b> Il ne fédère pas des tribus, il les remplace par une institution."
          },
          {
            "t": "Il bâtit un État : résister, c'est fonder un pouvoir durable.",
            "ok": true,
            "fb": "Impôt, monnaie, armée, villes, administration. <b>Résister, chez lui, c'est d'abord bâtir un pouvoir capable de durer</b>, et non mener des raids."
          },
          {
            "t": "Il modernise l'armée : la défaite venait d'un retard technique.",
            "ok": false,
            "fb": "Les historiens parlent bien d'une « modernisation défensive », mais elle ne se limite pas aux armes : <b>c'est tout l'appareil d'État qu'il emprunte à l'adversaire</b> pour tenir tête."
          }
        ]
      },
      {
        "k": "2 · La Tafna",
        "fact": "En 1837, le traité de la Tafna, signé avec le général Bugeaud, fait admettre par la France l'autorité de l'émir sur près des deux tiers du territoire.",
        "ask": "Que prouve cette signature ?",
        "opts": [
          {
            "t": "Que la France reconnaît en face d'elle un pouvoir rival organisé.",
            "ok": true,
            "fb": "On ne trace pas une frontière avec des bandes armées. En signant, la puissance coloniale admet un « pouvoir rival », <b>assez organisé pour qu'on négocie d'État à État.</b>"
          },
          {
            "t": "Que la France cherchait la paix : la conquête coûtait déjà cher.",
            "ok": false,
            "fb": "Le calcul français est réel, et il ne change rien à ce que le texte acte. <b>Le module regarde ce que le traité reconnaît</b>, pas ce qui a poussé à le signer."
          },
          {
            "t": "Que la France sous-estimait l'émir : elle croyait acheter sa neutralité.",
            "ok": false,
            "fb": "L'erreur d'appréciation ferait du traité un accident. Or il consacre une souveraineté effective : <b>capitale, armée régulière, impôt, écoles.</b> On ne reconnaît pas cela par distraction."
          }
        ]
      },
      {
        "k": "3 · Damas",
        "fact": "Reddition le 23 décembre 1847, puis cinq ans de captivité en France au lieu de l'exil promis. En juillet 1860, à Damas, l'émir ouvre sa maison et met à l'abri des milliers de chrétiens menacés par un massacre.",
        "ask": "Qu'est-ce que cet épisode installe ?",
        "opts": [
          {
            "t": "Que l'émir a changé : l'exil a fini par adoucir le guerrier.",
            "ok": false,
            "fb": "La conversion tardive supposerait deux hommes successifs. Le module en voit un seul : <b>il avait combattu la France au nom de l'islam, il sauve des Européens au nom du même islam.</b>"
          },
          {
            "t": "Que l'islam est tolérant : l'émir en administre ici la preuve.",
            "ok": false,
            "fb": "La démonstration édifiante déplace le sujet vers une religion à défendre. Le module vise plus précis : <b>ce que la défaite militaire n'a pas réussi à éteindre chez un homme, et chez un peuple.</b>"
          },
          {
            "t": "Qu'un socle survit aux armes : foi, langue, mémoire, conscience commune.",
            "ok": true,
            "fb": "Le vaincu de 1847 devient une référence morale reconnue jusqu'en Europe. <b>Une armée se détruit ; ce socle, lui, survit à la bataille.</b> C'est le concept du module."
          }
        ]
      },
      {
        "k": "4 · Le décret Chautemps",
        "fact": "Ibn Badis n'a ni canons ni armée : des écoles libres, des journaux, des cours du soir. En 1938, le décret Chautemps soumet à autorisation préalable l'ouverture des écoles arabes et coraniques.",
        "ask": "Pourquoi ce décret est-il l'argument du module ?",
        "opts": [
          {
            "t": "Parce qu'il mesure l'ampleur atteinte : le réseau devenait ingérable.",
            "ok": false,
            "fb": "Le nombre n'explique pas la loi : on encadre des écoles nombreuses, on ne les traite pas en adversaires. <b>Ce que le décret révèle, c'est la nature politique de ce qu'on y enseigne.</b>"
          },
          {
            "t": "Parce qu'on ne réprime pas une école inoffensive : c'était un front.",
            "ok": true,
            "fb": "C'est la leçon de méthode du module : « on ne réprime pas une école inoffensive ». Si l'administration légifère contre ces classes, <b>c'est qu'elle y voit un instrument de reconstruction d'un peuple, donc un adversaire.</b>"
          },
          {
            "t": "Parce qu'il vise l'arabe : la langue était la vraie cible coloniale.",
            "ok": false,
            "fb": "Le décret traite bien l'arabe <b>comme une langue étrangère sur son propre sol</b>, et ce n'est pas le raisonnement demandé : le module ne lit pas la cible, il lit ce que la répression prouve."
          }
        ]
      },
      {
        "k": "5 · La devise",
        "fact": "Le programme de tout le mouvement tient dans une phrase : « L'islam est notre religion, l'arabe notre langue, l'Algérie notre patrie. »",
        "ask": "Comment fonctionne cette devise ?",
        "opts": [
          {
            "t": "Elle répond point par point à ce que la colonisation avait défait.",
            "ok": true,
            "fb": "Culte sous tutelle, arabe rétrogradé au rang de langue étrangère, nation algérienne niée : à chacun des trois, un terme. <b>La culture devient le « premier terrain de la lutte ».</b>"
          },
          {
            "t": "Elle affirme une identité : trois piliers tenus en un seul programme.",
            "ok": false,
            "fb": "L'affirmation seule pourrait se passer d'adversaire. Or chaque terme vise une opération coloniale précise : <b>c'est une réponse, pas une profession de foi.</b>"
          },
          {
            "t": "Elle prépare l'indépendance : l'Algérie en fera sa propre devise.",
            "ok": false,
            "fb": "Exact sur la suite, et cela ne dit pas comment elle fonctionne. <b>Le « nous » y domine : une voix collective</b>, formée contre une entreprise qu'elle contredit terme à terme."
          }
        ]
      },
      {
        "k": "6 · Le duel de 1936",
        "fact": "Février 1936, Ferhat Abbas dans L'Entente : « J'ai interrogé l'Histoire, j'ai interrogé les vivants et les morts ». Avril 1936, Ibn Badis répond dans Ach-Chihab : « la nation algérienne musulmane s'est formée et existe ».",
        "ask": "Où passe exactement le désaccord ?",
        "opts": [
          {
            "t": "Sur les faits : l'un a mal cherché, l'autre a mieux cherché.",
            "ok": false,
            "fb": "Ce serait une querelle d'archives, réglable par une meilleure enquête. Abbas est sincère et il cherche vraiment : <b>ce n'est pas sa méthode qui échoue, c'est l'endroit où il regarde.</b>"
          },
          {
            "t": "Sur la loyauté : l'un veut l'égalité, l'autre veut la rupture.",
            "ok": false,
            "fb": "Le clivage politique est réel, et il vient après. La question qui les sépare est plus ancienne : <b>une nation existe-t-elle avant qu'on la revendique ?</b>"
          },
          {
            "t": "Sur le mode d'existence : on découvre une nation, ou on la transmet.",
            "ok": true,
            "fb": "Abbas la cherche dans les cimetières ; Ben Badis répond qu'on l'entretient par l'école, la presse, la langue. <b>L'Association des oulémas ne l'affirme pas, elle la fabrique jour après jour.</b>"
          }
        ]
      }
    ]
  }
};

/* ═══════════ MOTEUR ═══════════ */
(function(){
  var stage = document.getElementById('stage');
  var modsEl = document.getElementById('mods');
  var cur = null, qi = 0, score = 0, answered = false;
  var LET = ['A','B','C','D','E'];

  var __firstId = Object.keys(DATA)[0];
  (function(){
    var m = DATA[__firstId];
    var b = document.createElement('div');
    b.className = 'mod-btn';
    b.innerHTML = '<div class="mod-k">Module ' + m.key.slice(1) + ' · ' + m.qs.length + ' questions</div>';
    modsEl.appendChild(b);
  })();

  function start(id){
    cur = DATA[id]; qi = 0; score = 0;
    render();
  }
  start(__firstId);

  function render(){
    answered = false;
    var q = cur.qs[qi];
    var html = '';
    html += '<div class="playcard">';
    html += '<div class="hero"><div class="hk">Le rappel · ' + cur.key + '</div><div class="ht">' + cur.title + '</div><div class="hbar"><i style="width:' + (qi/cur.qs.length*100) + '%"></i></div><div class="hsc">Score <b>' + score + '</b> / ' + cur.qs.length + '</div></div>';
    html += '<div class="qcard">';
    html += '<div class="q-k">Question ' + q.k + '</div>';
    html += '<p class="q-fact">' + q.fact + '</p>';
    html += '<p class="q-ask">' + q.ask + '</p>';
    html += '<div class="opts">';
    for (var i=0;i<q.opts.length;i++){
      html += '<button type="button" class="opt" data-i="' + i + '"><span class="L">' + LET[i] + '</span><span class="tx">' + q.opts[i].t + '</span><span class="mk"></span></button>';
    }
    html += '</div><div id="fb-zone"></div><div class="next-row hidden" id="next-row"><button type="button" class="btn" id="next-btn">' + (qi < cur.qs.length-1 ? 'Question suivante' : 'Voir le résultat') + ' <span class="ar">→</span></button></div>';
    html += '</div></div>';
    stage.innerHTML = html;
    requestAnimationFrame(function(){
      var f = stage.querySelector('.hbar i');
      if (f) f.style.width = (qi/cur.qs.length*100) + '%';
    });
    var opts = stage.querySelectorAll('.opt');
    for (var j=0;j<opts.length;j++){ opts[j].addEventListener('click', pick); }
    document.getElementById('next-btn').addEventListener('click', next);
  }

  function pick(e){
    if (answered) return;
    answered = true;
    var q = cur.qs[qi];
    var idx = parseInt(e.currentTarget.getAttribute('data-i'), 10);
    var chosen = q.opts[idx];
    if (chosen.ok) score++;
    var opts = stage.querySelectorAll('.opt');
    for (var i=0;i<opts.length;i++){
      opts[i].setAttribute('disabled','');
      var o = q.opts[i];
      var mk = opts[i].querySelector('.mk');
      if (i === idx){
        opts[i].classList.add(o.ok ? 'picked-good' : 'picked-bad');
        mk.textContent = o.ok ? '✓' : '✕';
      } else if (o.ok){
        opts[i].classList.add('reveal-good');
        mk.textContent = '✓';
      } else {
        opts[i].classList.add('faded');
      }
    }
    document.getElementById('fb-zone').innerHTML = '<div class="fb"><span class="fb-k">Pourquoi</span>' + chosen.fb + '</div>';
    document.getElementById('next-row').classList.remove('hidden');
    var sc = stage.querySelector('.hsc b'); if (sc) sc.textContent = score;
    var bar = stage.querySelector('.hbar i'); if (bar) bar.style.width = ((qi+1)/cur.qs.length*100) + '%';
  }

  function next(){
    qi++;
    if (qi < cur.qs.length){ render(); }
    else { final(); }
    stage.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function final(){
    var n = cur.qs.length;
    var verdict;
    if (score === n) verdict = "Sans faute. Les contresens que ce module désamorce, vous les repérez désormais chez les autres. C'est exactement l'outil.";
    else if (score >= n-1) verdict = "L'essentiel tient. Relisez la correction de votre erreur : c'est la lecture que vous portiez en arrivant.";
    else if (score >= Math.ceil(n/2)) verdict = "Les corrections que vous venez de lire sont le vrai contenu de ce rappel. Elles valent une réécoute ciblée.";
    else verdict = "Ce module retourne des évidences, il est normal qu'il résiste. Réécoutez-le avec les corrections en tête : elles nomment vos lectures une par une.";
    var html = '';
    html += '<div class="final">';
    html += '<div class="final-k">Le rappel · ' + cur.key + ' · ' + cur.title + '</div>';
    html += '<div class="score">' + score + '<span> / ' + n + '</span></div>';
    html += '<p class="final-verdict">' + verdict + '</p>';
    html += '<div class="bascule"><div class="bascule-k">Maintenant, le carnet</div><p>' + cur.bascule + '</p></div>';
    html += '<div class="final-cta"><a class="btn" href="https://www.lautrerecit.com/algerie/carnet/" target="_blank" rel="noopener">Ouvrir mon carnet <span class="ar">→</span></a><button type="button" class="btn-ghost" id="redo">Refaire ce rappel</button></div>';
    html += '</div>';
    stage.innerHTML = html;
    document.getElementById('redo').addEventListener('click', function(){ qi=0; score=0; render(); });
  }
})();
</script>
