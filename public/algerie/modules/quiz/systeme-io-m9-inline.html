<div class="lrq">
<main class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <h1>Le <em>rappel</em>.</h1>
  <p class="lede">Cinq à six choix. Aucun ne teste votre mémoire : chacun oppose des <b>lectures défendables</b>, et une seule tient. Le vrai enseignement est dans la correction de celle que vous aurez choisie.</p>

  <div class="mods" id="mods"></div>

  <div class="stage" id="stage"></div>

  <div class="foot">
    <div class="foot-brand"><span></span>L'Autre Récit</div>
    <div class="foot-l">Le rappel · avant le carnet</div>
  </div>
</main>
</div>
<script>
/* ── Paramètres du cours (remplis par build-rappel.js) ── */
var COURS_LABEL = "Penser la résistance";
var COURS_NUM = "Cours III";
var eb = document.getElementById("eyebrow");
if (eb) eb.textContent = "L'Algérie a pensé · " + COURS_NUM + " · " + COURS_LABEL;

var DATA = {
  "m9": {
    "key": "M09",
    "title": "Malek Bennabi, la colonisabilité",
    "bascule": "Bennabi opère le seul retournement de toute la formation : <b>il tourne la lucidité vers soi.</b> Le carnet vous demande une dépendance que vous entretenez vous-même, et qui ne disparaîtrait pas si l'autre disparaissait. Nommer une faiblesse, ce n'est pas condamner celui qui la porte.",
    "qs": [
      {
        "k": "1 · La distinction",
        "fact": "Bennabi est ingénieur, formé à l'École spéciale de mécanique et d'électricité, et non à Polytechnique comme on le lit souvent. Il aborde la décadence comme un ingénieur devant une panne : un mécanisme à démonter pièce par pièce.",
        "ask": "Que sépare la colonisabilité de la colonisation ?",
        "opts": [
          {
            "t": "L'une est l'acte du colonisateur, l'autre un état du colonisé.",
            "ok": true,
            "fb": "L'armée qui débarque, le code qui s'installe d'un côté ; de l'autre, « l'aptitude d'une société à se laisser coloniser ». <b>Le colonisateur trouve la vulnérabilité déjà là ; il l'exploite.</b>"
          },
          {
            "t": "L'une décrit la conquête, l'autre ses effets durables sur les esprits.",
            "ok": false,
            "fb": "Les séquelles de la domination sont un vrai sujet, et c'est celui de Fanon au module suivant. Chez Bennabi la colonisabilité est en amont : <b>une cause, jamais une conséquence.</b>"
          },
          {
            "t": "L'une désigne le fait, l'autre le sentiment d'être dominé.",
            "ok": false,
            "fb": "Le vécu subjectif n'entre pas ici. Bennabi mesure l'état d'une société comme <b>un ingénieur mesure la fatigue d'un matériau</b> : un instrument d'analyse, pas une émotion."
          }
        ]
      },
      {
        "k": "2 · La formule",
        "fact": "Dans Vocation de l'islam, paru en 1954, distinct des Conditions de la renaissance algérienne, Bennabi écrit que le processus « ne commence pas par la colonisation, mais par la colonisabilité qui la provoque ».",
        "ask": "Que renverse exactement cette phrase ?",
        "opts": [
          {
            "t": "L'ordre moral : elle rend le colonisé responsable de sa conquête.",
            "ok": false,
            "fb": "C'est l'objection qu'on lui a faite, et le module la traite pour elle-même. Bennabi qualifiait le colonialisme de totalitaire : <b>il n'a jamais dédouané le colonisateur.</b>"
          },
          {
            "t": "L'ordre des faits : la conquête précède toujours la faiblesse intérieure.",
            "ok": false,
            "fb": "C'est l'ordre que la phrase inverse, pas celui qu'elle pose. Le sens est strictement contraire : <b>la faiblesse intérieure ouvre la porte, et la conquête s'y engouffre.</b>"
          },
          {
            "t": "L'ordre des causes : la porte était ouverte avant l'arrivée des troupes.",
            "ok": true,
            "fb": "D'où la conséquence pratique, pivot de sa pensée : <b>chasser le colonisateur ne suffit pas à cesser d'être colonisé ; il faut d'abord cesser d'être colonisable.</b>"
          }
        ]
      },
      {
        "k": "3 · Incolonisable",
        "fact": "Bennabi oppose deux figures. Le pays simplement conquis, où « il y a une synthèse préexistante » qui fait de l'homme un « incolonisable ». Et le pays où « toutes les conditions sociales existantes traduisent la colonisabilité de l'individu ».",
        "ask": "Que veut dire <em>incolonisable</em> ?",
        "opts": [
          {
            "t": "Invincible : une société assez forte n'est jamais envahie par personne.",
            "ok": false,
            "fb": "L'invasion n'est pas en cause. Une telle société <b>peut être envahie, écrasée, et ne devient pas colonisable au fond d'elle-même.</b> Elle plie sans se défaire."
          },
          {
            "t": "Non défait au fond : elle peut être écrasée sans devenir colonisable.",
            "ok": true,
            "fb": "Ses valeurs et son élan créateur la tiennent ensemble. À l'inverse, une société aux ressorts relâchés est <b>déjà colonisée de l'intérieur avant même l'arrivée des troupes.</b>"
          },
          {
            "t": "Inassimilable : elle résiste à la langue et aux usages du vainqueur.",
            "ok": false,
            "fb": "La résistance culturelle, c'était Ibn Badis au module précédent. Bennabi cherche plus bas : <b>la synthèse intérieure d'une civilisation</b>, l'homme, le sol et le temps tenus ensemble."
          }
        ]
      },
      {
        "k": "4 · Le post-almohadisme",
        "fact": "Après la chute de l'État almohade, la société musulmane ne s'effondre pas : les écoles restent pleines, les mosquées se bâtissent, les commentaires s'écrivent. Mais elle se met à se recopier.",
        "ask": "Qu'est-ce que le post-almohadisme, alors ?",
        "opts": [
          {
            "t": "Une créativité gelée : l'énergie reste réelle, l'invention s'immobilise.",
            "ok": true,
            "fb": "L'incapacité à « dépasser le donné, à aller au-delà du connu, à franchir de nouvelles étapes historiques ». <b>La civilisation continue de tourner, mais à vide.</b>"
          },
          {
            "t": "Un effondrement lent : la civilisation s'écroule au fil des siècles.",
            "ok": false,
            "fb": "Le contresens que le module signale comme dangereux : <b>il ferait de la colonisation le résultat naturel d'un peuple à terre.</b> Or rien ne s'est écroulé, tout continue."
          },
          {
            "t": "Un repli religieux : la foi finit par étouffer la pensée libre.",
            "ok": false,
            "fb": "La religion n'est pas l'accusée. Ce qui manque n'est pas la liberté de penser mais <b>l'invention : produire du neuf plutôt que reconduire l'ancien.</b>"
          }
        ]
      },
      {
        "k": "5 · Ibn Khaldoun",
        "fact": "Bennabi a lu La Muqaddima et reconnaît sa dette. Ibn Khaldoun pense la montée et la chute : une dynastie s'élève par sa cohésion, puis retombe quand cette cohésion se défait.",
        "ask": "Où Bennabi s'écarte-t-il de lui ?",
        "opts": [
          {
            "t": "Il le corrige : le cycle des dynasties ne tient plus à l'épreuve.",
            "ok": false,
            "fb": "Il ne réfute rien. Il reconnaît explicitement l'influence d'Ibn Khaldoun sur sa propre sociologie : <b>une même lignée, six siècles plus tard, pas une rectification.</b>"
          },
          {
            "t": "Il le transpose : ce que perd le groupe, l'individu le perd aussi.",
            "ok": false,
            "fb": "Le passage au singulier, c'est Fanon au module suivant. Bennabi reste au niveau du collectif : <b>il pense la décadence d'une civilisation entière, le long des siècles.</b>"
          },
          {
            "t": "Il prend le relais après la chute : les siècles de recopiage.",
            "ok": true,
            "fb": "Ibn Khaldoun s'arrête où Bennabi commence : <b>la longue phase où une civilisation survit sans se recréer.</b> La formation avait ouvert sur Ibn Khaldoun, elle referme ici la boucle."
          }
        ]
      },
      {
        "k": "6 · L'objection",
        "fact": "Sa thèse lui a valu d'être traité de traître par une partie du mouvement nationaliste : elle déplacerait la cause vers le colonisé, donc allégerait la responsabilité du colonisateur.",
        "ask": "Que répond le module à cette objection ?",
        "opts": [
          {
            "t": "Qu'il visait les élites diplômées, non le peuple qui subissait.",
            "ok": false,
            "fb": "Il vise bien « les élites diplômées, celles qui dénoncent le colonialisme en paroles », et restreindre la cible ne répond pas à l'objection. <b>La réponse porte sur la nature de l'énoncé, pas sur son destinataire.</b>"
          },
          {
            "t": "Qu'un diagnostic n'est pas un verdict : nommer n'est pas condamner.",
            "ok": true,
            "fb": "Un médecin qui nomme la maladie ne dit pas que le patient méritait d'être malade. <b>Le diagnostic rend une prise sur le réel là où la dénonciation seule laisse attendre le départ de l'autre.</b>"
          },
          {
            "t": "Que l'accusation venait des nationalistes de son temps : c'était politique.",
            "ok": false,
            "fb": "Dater l'accusation ne la réfute pas. Le module la prend au sérieux parce qu'elle est sérieuse : <b>tout l'enjeu tient entre expliquer une faiblesse et accuser une victime.</b>"
          }
        ]
      }
    ]
  }
};

/* ═══════════ MOTEUR ═══════════ */
(function(){
  var stage = document.getElementById('stage');
  var modsEl = document.getElementById('mods');
  var cur = null, qi = 0, score = 0, answered = false;
  var LET = ['A','B','C','D','E'];

  var __firstId = Object.keys(DATA)[0];
  (function(){
    var m = DATA[__firstId];
    var b = document.createElement('div');
    b.className = 'mod-btn';
    b.innerHTML = '<div class="mod-k">Module ' + m.key.slice(1) + ' · ' + m.qs.length + ' questions</div>';
    modsEl.appendChild(b);
  })();

  function start(id){
    cur = DATA[id]; qi = 0; score = 0;
    render();
  }
  start(__firstId);

  function render(){
    answered = false;
    var q = cur.qs[qi];
    var html = '';
    html += '<div class="playcard">';
    html += '<div class="hero"><div class="hk">Le rappel · ' + cur.key + '</div><div class="ht">' + cur.title + '</div><div class="hbar"><i style="width:' + (qi/cur.qs.length*100) + '%"></i></div><div class="hsc">Score <b>' + score + '</b> / ' + cur.qs.length + '</div></div>';
    html += '<div class="qcard">';
    html += '<div class="q-k">Question ' + q.k + '</div>';
    html += '<p class="q-fact">' + q.fact + '</p>';
    html += '<p class="q-ask">' + q.ask + '</p>';
    html += '<div class="opts">';
    for (var i=0;i<q.opts.length;i++){
      html += '<button type="button" class="opt" data-i="' + i + '"><span class="L">' + LET[i] + '</span><span class="tx">' + q.opts[i].t + '</span><span class="mk"></span></button>';
    }
    html += '</div><div id="fb-zone"></div><div class="next-row hidden" id="next-row"><button type="button" class="btn" id="next-btn">' + (qi < cur.qs.length-1 ? 'Question suivante' : 'Voir le résultat') + ' <span class="ar">→</span></button></div>';
    html += '</div></div>';
    stage.innerHTML = html;
    requestAnimationFrame(function(){
      var f = stage.querySelector('.hbar i');
      if (f) f.style.width = (qi/cur.qs.length*100) + '%';
    });
    var opts = stage.querySelectorAll('.opt');
    for (var j=0;j<opts.length;j++){ opts[j].addEventListener('click', pick); }
    document.getElementById('next-btn').addEventListener('click', next);
  }

  function pick(e){
    if (answered) return;
    answered = true;
    var q = cur.qs[qi];
    var idx = parseInt(e.currentTarget.getAttribute('data-i'), 10);
    var chosen = q.opts[idx];
    if (chosen.ok) score++;
    var opts = stage.querySelectorAll('.opt');
    for (var i=0;i<opts.length;i++){
      opts[i].setAttribute('disabled','');
      var o = q.opts[i];
      var mk = opts[i].querySelector('.mk');
      if (i === idx){
        opts[i].classList.add(o.ok ? 'picked-good' : 'picked-bad');
        mk.textContent = o.ok ? '✓' : '✕';
      } else if (o.ok){
        opts[i].classList.add('reveal-good');
        mk.textContent = '✓';
      } else {
        opts[i].classList.add('faded');
      }
    }
    document.getElementById('fb-zone').innerHTML = '<div class="fb"><span class="fb-k">Pourquoi</span>' + chosen.fb + '</div>';
    document.getElementById('next-row').classList.remove('hidden');
    var sc = stage.querySelector('.hsc b'); if (sc) sc.textContent = score;
    var bar = stage.querySelector('.hbar i'); if (bar) bar.style.width = ((qi+1)/cur.qs.length*100) + '%';
  }

  function next(){
    qi++;
    if (qi < cur.qs.length){ render(); }
    else { final(); }
    stage.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function final(){
    var n = cur.qs.length;
    var verdict;
    if (score === n) verdict = "Sans faute. Les contresens que ce module désamorce, vous les repérez désormais chez les autres. C'est exactement l'outil.";
    else if (score >= n-1) verdict = "L'essentiel tient. Relisez la correction de votre erreur : c'est la lecture que vous portiez en arrivant.";
    else if (score >= Math.ceil(n/2)) verdict = "Les corrections que vous venez de lire sont le vrai contenu de ce rappel. Elles valent une réécoute ciblée.";
    else verdict = "Ce module retourne des évidences, il est normal qu'il résiste. Réécoutez-le avec les corrections en tête : elles nomment vos lectures une par une.";
    var html = '';
    html += '<div class="final">';
    html += '<div class="final-k">Le rappel · ' + cur.key + ' · ' + cur.title + '</div>';
    html += '<div class="score">' + score + '<span> / ' + n + '</span></div>';
    html += '<p class="final-verdict">' + verdict + '</p>';
    html += '<div class="bascule"><div class="bascule-k">Maintenant, le carnet</div><p>' + cur.bascule + '</p></div>';
    html += '<div class="final-cta"><a class="btn" href="https://www.lautrerecit.com/algerie/carnet/" target="_blank" rel="noopener">Ouvrir mon carnet <span class="ar">→</span></a><button type="button" class="btn-ghost" id="redo">Refaire ce rappel</button></div>';
    html += '</div>';
    stage.innerHTML = html;
    document.getElementById('redo').addEventListener('click', function(){ qi=0; score=0; render(); });
  }
})();
</script>
